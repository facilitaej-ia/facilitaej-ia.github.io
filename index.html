<style id="css">
/* Layout: barra fixa, abertura com retrato circular, downloads em cartões, sobre, contato e rodapé. */
:root{

  --accent:#ea580c; --accent-hover:#c2410c; --accent-ink:#c2410c; --accent-bg:#fff7ed; --accent-line:#fed7aa;

  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}

    --shadow:0 12px 32px rgba(0,0,0,.55); --glow1:rgba(251,122,47,.08); --glow2:rgba(59,130,246,.07); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0d10; --surface:#15171b; --soft:#1a1d22; --line:#2a2e35; --fg:#f4f4f5; --body-c:#a1a1aa; --muted:#8b8b95;

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.has-bar{padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
section[id]{scroll-margin-top:84px}
.ico{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.lg{width:20px;height:20px}

/* barra */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:32px;height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:1.125rem;font-weight:700;letter-spacing:-.025em;white-space:nowrap;flex:none}
.brand img{height:32px;width:auto;display:block;transition:transform .15s}
.brand:hover img{transform:scale(1.05)}
.brand em{font-style:normal;color:var(--accent);font-weight:500}
.nav{display:none;align-items:center;gap:32px;font-size:.75rem;font-weight:600;color:var(--body-c)}
.nav a{text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{color:var(--fg)}
.nav a.first{color:var(--fg)}
.nav a.first:hover{color:var(--accent)}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.top-act{display:none;align-items:center;gap:12px;flex:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.5rem 1rem;font-size:.75rem;font-weight:600;color:var(--on-ink);background:var(--ink);border:1px solid var(--ink);border-radius:8px;text-decoration:none;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .15s,border-color .15s;line-height:1.3}
.pill:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.ghost{background:transparent;color:var(--accent-ink);border-color:var(--accent-line);box-shadow:none}
.pill.ghost:hover{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-ink)}
.burger{display:inline-grid;place-items:center;padding:8px;border:0;background:none;color:var(--body-c);cursor:pointer;border-radius:8px}
.burger:hover{color:var(--fg)}
@media (min-width:768px){.nav,.top-act{display:flex}.burger{display:none}}
.mmenu{border-bottom:1px solid var(--line);background:var(--surface);padding:20px 16px 24px;box-shadow:var(--shadow)}
.mmenu nav{display:flex;flex-direction:column;gap:12px;font-size:.875rem;font-weight:500;color:var(--body-c)}
.mmenu nav a{text-decoration:none;padding:4px 0}
.mmenu nav a.first{color:var(--accent);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mmenu .pill{display:flex;width:100%;margin-top:16px;padding:.7rem 1rem;background:var(--accent);border-color:var(--accent);color:#fff}
@media (min-width:768px){.mmenu{display:none}}

/* abertura */
.hero{position:relative;padding-top:24px;padding-bottom:48px;overflow:hidden}
@media (min-width:768px){.hero{padding-top:40px;padding-bottom:72px}}
.hero .glow{position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none}
.hero .g1{top:0;right:25%;width:384px;height:384px;background:var(--glow1)}
.hero .g2{top:40px;left:40px;width:320px;height:320px;background:var(--glow2)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:center}
@media (min-width:768px){.hero-grid{grid-template-columns:repeat(12,minmax(0,1fr));gap:40px}.hero-copy{grid-column:span 7}.hero-pic{grid-column:span 5}}
@media (min-width:1024px){.hero-grid{gap:56px}}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.kick img{width:16px;height:20px;object-fit:contain}
.kick .m{color:var(--muted)}
.hero h1{margin:20px 0 0;font-size:clamp(1.875rem,4.4vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1.12;text-wrap:balance}
.lead{margin:20px 0 0;max-width:36rem;color:var(--body-c);font-size:1rem;line-height:1.65}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:.75rem 1.25rem;font-size:.75rem;font-weight:600;letter-spacing:.02em;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s}
.hbtn.o{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.22)}
.hbtn.o:hover{background:var(--accent-hover)}
.hbtn.d{background:var(--ink);color:var(--on-ink);box-shadow:0 6px 16px rgba(9,9,11,.1)}
.hbtn.d:hover{opacity:.88}
.hbtn.w{background:var(--surface);color:var(--fg);border-color:var(--line);padding-inline:1rem}
.hbtn.w:hover{background:var(--soft)}
.hero-pic{display:flex;justify-content:center}
@media (min-width:768px){.hero-pic{justify-content:flex-end}}
.pic-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.aura{position:absolute;inset:-12px;border-radius:50%;background:linear-gradient(45deg,rgba(234,88,12,.2),rgba(234,88,12,.1),rgba(245,158,11,.1));filter:blur(24px);pointer-events:none}
.ring{position:relative;width:288px;height:288px;border-radius:50%;padding:4px;background:var(--surface);border:1px solid rgba(234,88,12,.3);box-shadow:0 25px 50px -12px rgba(9,9,11,.22)}
@media (min-width:640px){.ring{width:336px;height:336px}}
@media (min-width:1024px){.ring{width:390px;height:390px}}
.ring-in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.ring-in img.pic{width:100%;height:100%;object-fit:cover;object-position:53% 25%;transform:scale(1.18);transform-origin:53% 38%;display:block}
.ring-in img.ph{width:46%;height:auto}
.capsule{position:relative;margin-top:-24px;z-index:2;display:flex;align-items:center;gap:10px;padding:.5rem 1rem;border-radius:999px;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 10px 24px rgba(9,9,11,.12);font-size:.75rem}
.capsule img{width:16px;height:20px;object-fit:contain}
.capsule b{font-weight:700}
.capsule .sep{color:var(--line)}
.capsule a{font:600 .6875rem var(--mono);color:var(--accent-ink);text-decoration:none}
.capsule a:hover{color:var(--accent-hover)}

/* seções */
.sec{position:relative;border-top:1px solid var(--line)}
.sec-pad{padding-block:80px}
@media (min-width:640px){.sec-pad.big{padding-block:128px}}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font:600 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow img{width:16px;height:20px;object-fit:contain}
.eyebrow.gray{color:var(--muted);font-weight:400;margin-bottom:8px}
.eyebrow.gray b{color:var(--accent-ink);font-weight:700}
h2.t{margin:0;font-size:clamp(1.875rem,4vw,2.25rem);font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.dl-head{display:flex;flex-direction:column;gap:24px;justify-content:space-between;margin-bottom:56px;padding-bottom:32px;border-bottom:1px solid var(--line)}
@media (min-width:768px){.dl-head{flex-direction:row;align-items:flex-end}}
.dl-head h2.t{font-size:clamp(1.875rem,5vw,3rem);font-weight:700}
.dl-side{max-width:28rem;display:flex;flex-direction:column;gap:8px}
.dl-side p{margin:0;font-size:.875rem;color:var(--body-c);line-height:1.65}
.linkbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;font-size:.75rem;font-weight:600;color:var(--accent-ink);text-align:left}
.linkbtn:hover{color:var(--accent-hover)}
.guide{margin-bottom:48px;padding:24px;border-radius:16px;background:var(--accent-bg);border:1px solid var(--accent-line)}
.guide h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:.875rem;font-weight:700}
.guide h3 .ico{color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;font-size:.75rem;color:var(--body-c)}
.steps div{padding:12px;background:var(--surface);border-radius:12px;border:1px solid var(--accent-line)}
.steps span{display:block;margin-bottom:4px;font:700 .75rem var(--mono);color:var(--accent-ink)}
.steps strong{color:var(--fg)}
.owner{margin-bottom:28px;padding:14px 16px;border:1px dashed var(--accent);border-radius:12px;background:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.owner p{margin:0;font-size:.875rem;color:var(--body-c);flex:1 1 260px}
.owner .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:768px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;justify-content:space-between;min-width:0;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(9,9,11,.04);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#a1a1aa;box-shadow:var(--shadow)}
.card-b{padding:24px}
@media (min-width:640px){.card-b{padding:32px}}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.badge{font:600 .6875rem var(--mono);padding:.25rem .6rem;border-radius:6px;border:1px solid}
.badge.c0{color:var(--b1);background:var(--b1bg);border-color:var(--b1l)}
.badge.c1{color:var(--b2);background:var(--b2bg);border-color:var(--b2l)}
.badge.c2{color:var(--b3);background:var(--b3bg);border-color:var(--b3l)}
.badge.c3{color:var(--accent-ink);background:var(--accent-bg);border-color:var(--accent-line)}
.size{font:400 .75rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{margin:0 0 4px;font-size:1.375rem;font-weight:700;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
@media (min-width:640px){.card h3{font-size:1.5rem}}
.sub{margin:0 0 12px;font-size:.75rem;font-weight:500;color:var(--accent-ink)}
.card p.d{margin:0 0 24px;font-size:.875rem;color:var(--body-c);line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}
.compat{margin:0 0 24px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);font:400 .6875rem/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.compat b{color:var(--body-c);font-weight:600}
.card-f{padding:0 24px 24px}
@media (min-width:640px){.card-f{padding:0 32px 32px}}
.cta{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:.75rem 1rem;border-radius:12px;font-size:.75rem;font-weight:600;letter-spacing:.02em;text-decoration:none;background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);box-shadow:0 1px 2px rgba(9,9,11,.08);transition:background .15s;cursor:pointer}
.cta:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cta[aria-disabled="true"]{background:var(--soft);color:var(--muted);border-color:var(--line);box-shadow:none;cursor:default}
.cta[aria-disabled="true"]:hover{background:var(--soft);color:var(--muted);border-color:var(--line)}
.adm{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px 16px;border-top:1px dashed var(--line)}
.pmeta{margin-top:10px;font:400 .75rem var(--mono);color:var(--muted);text-align:center;overflow-wrap:anywhere}
.proj-r .adm{padding:12px 0 0;margin-top:12px}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:.3rem .65rem;font-size:.75rem;font-weight:500;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini.danger{color:var(--danger);border-color:var(--danger)}
.empty{grid-column:1/-1;padding:44px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* sobre */
.about-in{max-width:48rem}
.about-in h2.t{margin-bottom:24px}
.about-in .tx{display:flex;flex-direction:column;gap:16px;font-size:1rem;color:var(--body-c);line-height:1.65}
.about-in .tx p{margin:0}
.about-in .tx strong{color:var(--fg);font-weight:600}
.about-in .tx .s{font-size:.875rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.soft-btn{display:inline-flex;align-items:center;gap:8px;padding:.625rem 1rem;border-radius:12px;font-size:.75rem;font-weight:600;text-decoration:none;border:1px solid;transition:background .15s}
.soft-btn.o{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-line)}
.soft-btn.o:hover{filter:brightness(.97)}
.soft-btn.g{background:var(--soft);color:var(--fg);border-color:var(--line)}
.soft-btn.g:hover{background:var(--line)}
.soft-btn .ico{width:16px;height:16px}

/* contato */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start}
@media (min-width:1024px){.contact-grid{grid-template-columns:repeat(12,minmax(0,1fr))}.contact-l{grid-column:span 5}.contact-r{grid-column:span 7}}
.contact-l h2.t{margin-bottom:8px}
.contact-l .pp{margin:0;font-size:.875rem;color:var(--body-c)}
.chan{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.chan:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(9,9,11,.08)}
.chans{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.chan .l{display:flex;align-items:center;gap:12px;min-width:0}
.chan .ib{padding:8px;border-radius:8px;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center}
.chan b{display:block;font-size:.875rem;font-weight:700}
.chan small{display:block;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.chan .ar{color:var(--muted)}
.formc{padding:24px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(9,9,11,.06)}
@media (min-width:640px){.formc{padding:32px}}
.formc h3{margin:0 0 16px;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.f{display:grid;gap:16px}
.f label,.f legend{display:block;font:600 .75rem var(--mono);color:var(--body-c);margin-bottom:4px}
.f input[type=text],.f input[type=url],.f input[type=email],.f select,.f textarea{width:100%;padding:.625rem .875rem;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:.75rem}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.f textarea{min-height:100px;resize:vertical}
.f .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.f .two{grid-template-columns:minmax(0,1fr)}}
.f fieldset{border:0;padding:0;margin:0}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.modes label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.4rem .8rem;font:500 .8125rem var(--sans);color:var(--fg);cursor:pointer;margin:0}
.stat{font-size:.8125rem;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.stat.bad{color:var(--danger)}
.hint{font-size:.8125rem;color:var(--muted);margin:6px 0 0}
.err{color:var(--danger);font-size:.75rem;margin:0;min-height:1.2em}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.note{margin:12px 0 0;font-size:.75rem;color:var(--muted)}

/* rodapé */
.foot{background:var(--surface);border-top:1px solid var(--line);padding:64px 0 48px;color:var(--body-c)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
@media (min-width:768px){.foot-grid{grid-template-columns:repeat(12,minmax(0,1fr))}.fb{grid-column:span 5}.fn{grid-column:span 3}.ft{grid-column:span 4}}
.foot .brand{font-size:1.25rem;color:var(--fg)}
.foot p{margin:16px 0 0;max-width:24rem;font-size:.75rem;line-height:1.65}
.foot .ln{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px;font-size:.75rem}
.foot .ln a{display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.foot .ln a:hover{color:var(--fg)}
.foot .ln .ico{color:var(--accent)}
.foot h4{margin:0 0 12px;font:700 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.75rem}
.foot ul a{text-decoration:none;display:flex;justify-content:space-between;gap:12px}
.foot ul a:hover{color:var(--fg)}
.foot ul a small{font:600 .625rem var(--mono);color:var(--accent-ink)}
.copy{margin-top:48px;padding-top:32px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;font:400 .75rem var(--mono);color:var(--muted)}
@media (min-width:640px){.copy{flex-direction:row;justify-content:space-between}}


/* projetos, laboratório, manifesto */
.sec-head{max-width:48rem;margin-bottom:48px}
.sec-head h2.t{font-size:clamp(1.875rem,4.6vw,2.75rem);font-weight:800;margin-bottom:20px}
.sec-head p{margin:0 0 14px;color:var(--body-c);font-size:1rem;line-height:1.65}
.sec-head .q{color:var(--fg);font-weight:600}
.projs{display:flex;flex-direction:column;gap:24px}
.proj{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;padding:24px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(9,9,11,.04)}
@media (min-width:640px){.proj{padding:36px}}
@media (min-width:900px){.proj{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:48px}}
.ptag{display:inline-block;font:600 .6875rem var(--mono);letter-spacing:.06em;padding:.25rem .6rem;border-radius:6px;border:1px solid;margin-bottom:14px}
.ptag.c0{color:var(--b1);background:var(--b1bg);border-color:var(--b1l)}
.ptag.c1{color:var(--b2);background:var(--b2bg);border-color:var(--b2l)}
.ptag.c2{color:var(--b3);background:var(--b3bg);border-color:var(--b3l)}
.proj .sub{margin:0 0 10px;font-size:.8125rem}
.proj h3{margin:0 0 16px;font-size:clamp(1.375rem,2.6vw,1.75rem);font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.proj p{margin:0 0 12px;font-size:.9375rem;line-height:1.65;color:var(--body-c)}
.proj p.key{color:var(--fg);font-weight:600;padding-left:14px;border-left:2px solid var(--accent)}
.proj-r{display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.hl{padding:18px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.hl b{display:block;margin-bottom:10px;font:600 .6875rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:.8125rem;color:var(--body-c)}
.hl li{display:flex;gap:8px;line-height:1.45}
.hl li::before{content:"";flex:none;width:6px;height:6px;margin-top:.45em;border-radius:50%;background:var(--accent)}
.exp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0;padding:0;list-style:none}
@media (min-width:768px){.exp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exp-grid li{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9375rem;color:var(--body-c);line-height:1.5}
.exp-grid li span{flex:none;font:600 .75rem var(--mono);color:var(--accent-ink);padding-top:.15rem}
.exp-end{margin-top:32px;font-size:1.0625rem;line-height:1.7;color:var(--body-c)}
.exp-end b{display:block;color:var(--fg);font-weight:700}
.who-row{display:flex;align-items:center;gap:16px;margin:28px 0 12px}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:53% 25%;transform:scale(2);transform-origin:53% 35%;display:block}
.who-row h3{margin:0;font-size:1.375rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.who-row span{font:400 .75rem var(--mono);color:var(--muted)}
.about-in .tx .key{color:var(--fg);font-weight:600}
.seq{display:flex;flex-direction:column;font-size:1.0625rem;line-height:1.5;color:var(--fg);font-weight:600}
.manifesto{text-align:left}
.manifesto h2.t{margin-bottom:24px;max-width:20ch}
.manifesto .tx{max-width:40rem;display:flex;flex-direction:column;gap:14px;font-size:1.0625rem;color:var(--body-c);line-height:1.65}
.manifesto .tx p{margin:0}
.manifesto .lines{padding-left:16px;border-left:2px solid var(--accent);color:var(--fg);font-weight:700;font-size:1.125rem;line-height:1.7}
.open-l{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.open-l li{padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem;color:var(--body-c)}
.open-t{margin:24px 0 0;font-size:.875rem;font-weight:600}
.support{margin:20px 0 0;font:500 .75rem var(--mono);letter-spacing:.02em;color:var(--muted)}
.foot .tagl{margin:16px 0 0;font-size:.875rem;color:var(--fg);font-weight:600}
.foot .mt{margin-top:6px;font-size:.75rem}

/* painel do dono */
#saveBar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#saveBar .bar-in{max-width:1280px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#barMsg{font-size:.875rem;min-width:0;flex:1 1 220px}
#saveBar .acts{display:flex;gap:8px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(9,9,11,.62);overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:560px;margin:min(5vh,40px) auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.sheet h4{margin:0 0 16px;font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:.6rem 1rem;font-size:.8125rem;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
</style>

function actHTML(it){
  var f=fmtOf(it);
  if(hasFile(it))return '<a class="cta" href="'+esc(it.file.url)+'" target="_blank" rel="noopener">'+ic('dl')+'<span>Baixar'+(f?' ('+esc(f)+')':'')+'</span></a>';
  if(hasLink(it))return '<a class="cta" href="'+esc(it.link)+'" target="_blank" rel="noopener"><span>Acessar</span>'+ic('ext')+'</a>';
  return '<span class="cta" aria-disabled="true">Em breve</span>';
}
function admHTML(it){
  if(!state.admin)return '';
  var del=state.confirmDel===it.id
    ?'<button class="mini danger" data-act="del" data-id="'+esc(it.id)+'">Confirmar exclusão</button><button class="mini" data-act="nodel">Cancelar</button>'
    :'<button class="mini" data-act="del" data-id="'+esc(it.id)+'">Excluir</button>';
  return '<div class="adm"><button class="mini" data-act="edit" data-id="'+esc(it.id)+'">Editar</button>'+
    '<button class="mini" data-act="up" data-id="'+esc(it.id)+'" aria-label="Mover para cima">↑</button>'+
    '<button class="mini" data-act="down" data-id="'+esc(it.id)+'" aria-label="Mover para baixo">↓</button>'+del+'</div>';
}
function cardHTML(it,i){
  var f=fmtOf(it),avail=hasFile(it)||hasLink(it);

  var size=hasFile(it)?fmtSize(it.file.size):(hasLink(it)?'Web':'');
  return '<article class="card"><div class="card-b"><div class="card-top"><span class="badge c'+(i%4)+'">'+esc(badge)+'</span><span class="size">'+esc(size)+'</span></div>'+
    '<h3>'+esc(it.name)+'</h3>'+(it.subtitle?'<div class="sub">'+esc(it.subtitle)+'</div>':'<div class="sub" style="margin-bottom:12px"></div>')+
    (it.description?'<p class="d">'+esc(it.description)+'</p>':'')+
    (it.target?'<div class="compat"><b>Compatibilidade:</b> '+esc(it.target)+'</div>':'')+'</div>'+

function projHTML(p,i){

    '<div class="proj-r">'+(p.hl.length?'<div class="hl"><b>Destaques</b><ul>'+p.hl.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'<div></div>')+'<div>'+p.btnHTML+(p.meta?'<div class="pmeta">'+esc(p.meta)+'</div>':'')+(p.adm||'')+'</div></div></article>';

function itemProj(it,i){
  var f=fmtOf(it),btn;
  var label=it.btn||('Baixar '+it.name);
  if(hasFile(it))btn='<a class="cta" href="'+esc(it.file.url)+'" target="_blank" rel="noopener">'+ic('dl')+'<span>'+esc(label)+'</span></a>';
  else if(hasLink(it))btn='<a class="cta" href="'+esc(it.link)+'" target="_blank" rel="noopener"><span>'+esc(label)+'</span>'+ic('ext')+'</a>';
  else btn='<span class="cta" aria-disabled="true">Em breve</span>';
  var meta=[it.version,f,hasFile(it)?fmtSize(it.file.size):'',it.target?('Compatível com '+it.target):''].filter(Boolean).join(' · ');
  var paras=lines(it.description);if(it.key)paras.push('**'+it.key.replace(/\*/g,'')+'**');
  return {tag:it.tag||it.name.toUpperCase(),c:i%3,kicker:it.subtitle,head:it.name,paras:paras,hl:lines(it.highlights),btnHTML:btn,meta:meta,adm:admHTML(it)};
}

/* ---------- uploads ---------- */
function uploadMsg(e){
  var c=e&&e.code;
  if(c==='too_large')return 'Arquivo acima de 50 MB. Use a opção Colar link.';
  if(c==='no_login')return 'Entre na sua conta de administrador para enviar arquivos.';
  if(e&&e.message&&/row-level security|not authorized|Unauthorized|JWT/i.test(e.message))return 'Sua conta não tem permissão para enviar. Entre de novo.';
  return 'Não foi possível enviar. Tente de novo ou use Colar link.';
}
async function setPhoto(file){
  var msg=$('#photoMsg');msg.className='stat';msg.textContent='Enviando…';
  try{
    var r=await uploadFile(file);
    data.profile=data.profile||{};data.profile.photo={id:r.id,url:r.url};
    msg.textContent='';markDirty();
  }catch(e){msg.className='stat bad';msg.textContent=e&&e.code==='none'?'Envio indisponível nesta visualização.':uploadMsg(e)}
}
async function doUpload(file){
  var st=$('#fileStat');if(!file||!st||!state.edit)return;
  st.className='stat';st.textContent='Enviando…';state.edit.uploading++;$('#saveItem').disabled=true;
  try{
    var r=await uploadFile(file);
    if(!state.edit)return;
    state.edit.d.file={id:r.id,url:r.url,name:file.name,size:r.sizeBytes,type:r.contentType};
    st.textContent=file.name+' · '+fmtSize(r.sizeBytes)+' enviado.';
  }catch(e){
    if(!state.edit)return;
    st.className='stat bad';st.textContent=e&&e.code==='none'?'Envio indisponível. Use Colar link.':uploadMsg(e);
  }finally{
    if(state.edit){state.edit.uploading--;var b=$('#saveItem');if(b)b.disabled=state.edit.uploading>0}
  }
}

function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';state.edit=null}
function saveItem(){
  var ed=state.edit;if(!ed||ed.contact||ed.linkId)return;
  var err=function(m){$('#formErr').textContent=m};
  var name=$('#f-name').value.trim();if(!name)return err('Informe o nome do item.');
  var mode=$('input[name=mode]:checked').value,link=$('#f-link').value.trim();
  if(mode==='file'&&!ed.d.file)return err('Envie o arquivo ou escolha Colar link ou Em breve.');
  if(mode==='link'&&!/^https:\/\/[^\s]+$/i.test(link))return err('Cole um link completo que comece com https://');
  var v=function(id){return $(id).value.trim()};
  var it={id:ed.d.id,name:name,tag:v('#f-tag'),subtitle:v('#f-sub'),version:v('#f-ver'),format:v('#f-fmt'),target:v('#f-tgt'),description:v('#f-desc'),key:v('#f-key'),highlights:v('#f-hl'),btn:v('#f-btn'),mode:mode,file:mode==='file'?ed.d.file:null,link:mode==='link'?link:''};
  if(ed.isNew)data.items.unshift(it);else data.items=data.items.map(function(x){return x.id===it.id?it:x});
  closeModal();markDirty();
}
function saveContact(){
  var em=$('#f-mail').value.trim();
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('#formErr').textContent='Informe um e-mail válido.';return}
  data.contact.email=em;closeModal();markDirty();
}

/* ---------- publicar ---------- */
async function publish(){
  if(!SB.admin||state.busy)return;
  state.busy=true;$('#pubBtn').disabled=true;$('#barMsg').textContent='Salvando…';
  data.updated=new Date().toISOString();
  try{
    var out=JSON.parse(JSON.stringify(data));
    if(out.profile&&out.profile.photo&&/^data:/.test(out.profile.photo.url||''))delete out.profile.photo.url;
    var keep={};data.items.forEach(function(x){if(x.file&&x.file.id)keep[x.file.id]=1});
    var gone=[];BASE.items.forEach(function(x){if(x.file&&x.file.id&&!keep[x.file.id])gone.push(x.file.id)});
    await sbFetch('/rest/v1/site_content?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:out,updated_at:data.updated})});
    for(var k=0;k<gone.length;k++){try{await sbFetch('/storage/v1/object/downloads/'+encodeURIComponent(gone[k]),{method:'DELETE'})}catch(e){}}
    BASE=JSON.parse(JSON.stringify(data));state.busy=false;state.dirty=false;$('#pubBtn').disabled=false;renderAll();toast('Alterações publicadas no site.');
  }catch(e){state.busy=false;$('#pubBtn').disabled=false;$('#barMsg').textContent='Não foi possível salvar: '+((e&&e.message)||'erro de conexão')+'. Se pedir login, entre de novo.'}
}

/* ---------- eventos ---------- */
function move(id,dir){
  var i=data.items.findIndex(function(x){return x.id===id}),j=i+dir;
  if(i<0||j<0||j>=data.items.length)return;
  var t=data.items[i];data.items[i]=data.items[j];data.items[j]=t;markDirty();
}
document.addEventListener('click',function(ev){
  var t=ev.target;
  if(t.id==='modal'&&!(state.edit&&state.edit.uploading)){closeModal();return}
  var send=t.closest('#c-send');
  if(send){
    var n=$('#c-name').value.trim(),m=$('#c-msg').value.trim(),er=$('#c-err');
    if(!n||!m){ev.preventDefault();er.textContent='Preencha o nome e a mensagem.';return}
    er.textContent='';
    var body='Olá, meu nome é '+n+'.\n\n'+m+'\n\nAssunto: '+$('#c-int').value;
    send.href='mailto:'+data.contact.email+'?subject='+encodeURIComponent('Contato pelo site: '+$('#c-int').value)+'&body='+encodeURIComponent(body);
    return;
  }
  if(t.closest('[data-close]')&&state.menu&&t.closest('a')){state.menu=false;renderAll();return}
  var b=t.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(act==='toggleAdmin'){ev.preventDefault();state.admin=!state.admin;state.confirmDel=null;state.menu=false;try{sessionStorage.setItem('adm',state.admin?'1':'0')}catch(e){}renderAll()}
  else if(act==='menu'){state.menu=!state.menu;renderAll()}
  else if(act==='guide'){state.guide=!state.guide;renderAll()}
  else if(act==='new')openEditor(null);
  else if(act==='edit')openEditor(id);
  else if(act==='contact')openContact();
  else if(act==='plink')openLink(id);
  else if(act==='login'){ev.preventDefault();openLogin()}
  else if(act==='logout')logout();
  else if(act==='up')move(id,-1);
  else if(act==='down')move(id,1);
  else if(act==='del'){
    if(state.confirmDel===id){data.items=data.items.filter(function(x){return x.id!==id});state.confirmDel=null;markDirty()}
    else{state.confirmDel=id;renderGrid()}
  }
  else if(act==='nodel'){state.confirmDel=null;renderAll()}
  else if(act==='closeModal')closeModal();
  else if(act==='discard'){
    data=load(JSON.parse(JSON.stringify(BASE)));
    state.dirty=false;state.confirmDel=null;renderAll();
  }
  else if(act==='publish')publish();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.name==='mode'){$('#box-file').hidden=t.value!=='file';$('#box-link').hidden=t.value!=='link'}
  else if(t.id==='f-file'&&t.files[0])doUpload(t.files[0]);
  else if(t.id==='f-photo'&&t.files[0]){setPhoto(t.files[0]);t.value=''}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id==='ef'){ev.preventDefault();saveItem()}
  else if(ev.target.id==='cf'){ev.preventDefault();saveContact()}
  else if(ev.target.id==='lf'){ev.preventDefault();saveLink()}
  else if(ev.target.id==='lg'){ev.preventDefault();doLogin()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#modal').hidden)closeModal()});

shell();renderAll();

/* ---------- Supabase: leitura pública, login e gravação do administrador (API REST direta) ---------- */
var SB={admin:false,session:null};
function saveSess(x){SB.session=x;try{if(x)localStorage.setItem('fej-session',JSON.stringify(x));else localStorage.removeItem('fej-session')}catch(e){}}
function loadSess(){try{return JSON.parse(localStorage.getItem('fej-session')||'null')}catch(e){return null}}
async function authCall(path,body){
  var r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Falha de autenticação');
  return j;
}
function toSess(j,prev){return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(prev&&prev.email)||''}}
async function token(){
  var x=SB.session||loadSess();if(!x)throw {code:'no_login'};
  if(x.expires_at-60<Date.now()/1000){var j=await authCall('token?grant_type=refresh_token',{refresh_token:x.refresh_token});x=toSess(j,x);saveSess(x)}
  SB.session=x;return x.access_token;
}
async function sbFetch(path,opts){
  var tok=await token();opts=opts||{};
  opts.headers=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+tok},opts.headers||{});
  var r=await fetch(SB_URL+path,opts);
  if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw new Error(j.message||j.error||('Erro '+r.status))}
  return r;
}
async function uploadFile(file){
  if(!SB.admin)throw {code:'no_login'};
  if(file.size>52428800)throw {code:'too_large'};
  var clean=file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-');
  var path=Date.now().toString(36)+'-'+clean;
  await sbFetch('/storage/v1/object/downloads/'+path,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
  return {id:path,url:SB_URL+'/storage/v1/object/public/downloads/'+path,sizeBytes:file.size,contentType:file.type||''};
}
async function fetchRemote(){
  if(!SB_URL||!SB_KEY)return;
  try{
    var r=await fetch(SB_URL+'/rest/v1/site_content?id=eq.1&select=data',{headers:{apikey:SB_KEY}});
    if(!r.ok)return;var rows=await r.json();
    if(rows&&rows[0]&&rows[0].data&&!state.dirty){var d=load(rows[0].data);data=d;BASE=JSON.parse(JSON.stringify(d));renderAll()}
  }catch(e){}
}
function openLogin(){
  state.edit={login:true};
  $('#modal').innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h4 id="mt">Entrar como administrador</h4>'+
   '<form class="f" id="lg" novalidate><div><label for="l-mail">E-mail</label><input type="email" id="l-mail" autocomplete="username" value="'+esc(CFG.admin||'')+'"></div>'+
   '<div><label for="l-pass">Senha</label><input type="password" id="l-pass" autocomplete="current-password"></div>'+
   '<p class="err" id="formErr" role="alert"></p><div class="row"><button type="button" class="pill ghost" data-act="closeModal">Cancelar</button><button type="submit" class="pill" id="lgBtn">Entrar</button></div></form></div>';
  $('#modal').hidden=false;setTimeout(function(){var n=$('#l-pass');if(n)n.focus()},0);
}
async function doLogin(){
  var em=$('#l-mail').value.trim(),pw=$('#l-pass').value,err=$('#formErr'),btn=$('#lgBtn');
  if(!em||!pw){err.textContent='Informe e-mail e senha.';return}
  if(!SB_URL||!SB_KEY){err.textContent='O painel ainda não foi configurado.';return}
  btn.disabled=true;err.textContent='';
  try{
    var j=await authCall('token?grant_type=password',{email:em,password:pw});
    var x=toSess(j);
    if(ADMIN&&x.email.toLowerCase()!==ADMIN)throw new Error('Esta conta não é a do administrador.');
    saveSess(x);SB.admin=true;state.canAdmin=true;state.admin=true;try{sessionStorage.setItem('adm','1')}catch(e){}
    closeModal();renderAll();toast('Você entrou. Modo administrador ativo.');
  }catch(e){btn.disabled=false;err.textContent=/Invalid login/i.test(e.message||'')?'E-mail ou senha incorretos.':(e.message||'Não foi possível entrar.')}
}
async function logout(){
  try{var tok=await token();await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok}})}catch(e){}
  saveSess(null);SB.admin=false;state.canAdmin=false;state.admin=false;state.dirty=false;try{sessionStorage.removeItem('adm')}catch(e){}
  data=load(JSON.parse(JSON.stringify(BASE)));renderAll();toast('Você saiu da conta.');
}
fetchRemote();
(async function(){
  try{
    if(!SB_URL||!SB_KEY)return;
    var x=loadSess();
    if(x&&(!ADMIN||(x.email||'').toLowerCase()===ADMIN)){
      try{await token();SB.admin=true;state.canAdmin=true;try{state.admin=sessionStorage.getItem('adm')==='1'}catch(e){}renderAll()}catch(e){saveSess(null)}
    }
    if(location.hash==='#admin'&&!SB.admin)openLogin();
  }catch(e){}
})();
})();
</script>
